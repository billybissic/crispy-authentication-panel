@if (showLogin) {
  <div class="auth-login-placeholder">Login</div>
} @else {
  <div class="auth-shell" [class.sidebar-open]="sidebarOpen">
    <aside class="auth-sidebar" aria-label="Authentication navigation">
      <div class="auth-brand"><div class="auth-brand-mark" aria-hidden="true">✦</div><div><strong>CRISPY DISCO</strong><span>AUTHENTICATION</span></div></div>
      <div class="auth-nav-label">WORKSPACE</div>
      <nav class="auth-nav">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"><span aria-hidden="true">◫</span> Overview</a>
        <a routerLink="/users" routerLinkActive="active"><span aria-hidden="true">◉</span> Users</a>
        @if (isAdministrator) { <a routerLink="/administrators" routerLinkActive="active"><span aria-hidden="true">◇</span> Administrators</a> }
        <a routerLink="/api-keys" routerLinkActive="active"><span aria-hidden="true">⌁</span> API Keys</a>
        @if (isAdministrator) {
          <a routerLink="/configurations" routerLinkActive="active"><span aria-hidden="true">⚙</span> Configurations</a>
          <a routerLink="/logs" routerLinkActive="active"><span aria-hidden="true">≡</span> Logs</a>
        }
      </nav>
      <div class="auth-sidebar-footer"><span class="auth-status-dot"></span> Authentication workspace<a routerLink="/about">About</a></div>
    </aside>
    <div class="auth-main">
      <header class="auth-topbar">
        <button class="auth-menu-button" type="button" (click)="sidebarOpen = !sidebarOpen" aria-label="Toggle navigation">☰</button>
        <div class="auth-breadcrumb">CRISPY DISCO <span>/</span> AUTHENTICATION</div>
        <div class="auth-topbar-right"><span class="auth-environment">CONTROL PANEL</span><span class="auth-avatar" aria-label="Account">B</span></div>
      </header>
      <main class="auth-content"><router-outlet /></main>
    </div>
  </div>
}
